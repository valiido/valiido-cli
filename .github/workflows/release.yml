name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install import tool dependencies
        run: python -m pip install -r skills/valiido/scripts/requirements.txt
      - name: Run quality and integrity checks
        run: bin/quality
      - name: Build release archives
        run: bin/release "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
