version: 2
updates:
  # bin/update owns version updates; keep Dependabot security updates enabled.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: "/skills/valiido/scripts"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
